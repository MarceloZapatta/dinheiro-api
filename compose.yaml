version: "3.8"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        image: dinheiro-api-app:latest
        container_name: dinheiro-api-app
        working_dir: /var/www/html
        environment:
            - HOST_UID=${HOST_UID:-1000}
            - HOST_GID=${HOST_GID:-1000}
        volumes:
            - ./:/var/www/html
        networks:
            - dinheiro-net
        depends_on:
            - mariadb
    nginx:
        image: nginx:alpine
        container_name: dinheiro-api-nginx
        ports:
            - "8000:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/logs:/var/log/nginx
        depends_on:
            - app
        networks:
            - dinheiro-net
    mariadb:
        image: "mariadb:10.5"
        container_name: dinheiro-api-mariadb
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
            MYSQL_DATABASE: "${DB_DATABASE}"
            MYSQL_USER: "${DB_USERNAME}"
            MYSQL_PASSWORD: "${DB_PASSWORD}"
        volumes:
            - "dinheiro-mariadb:/var/lib/mysql"
        networks:
            - dinheiro-net

networks:
    dinheiro-net:
        driver: bridge

volumes:
    dinheiro-mariadb:

services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        container_name: dinheiro-api-app
        working_dir: /var/www/html
        environment:
            - HOST_UID=${HOST_UID:-1000}
            - HOST_GID=${HOST_GID:-1000}
        volumes:
            - ./:/var/www/html
        networks:
            - dinheiro-net
    nginx:
        image: nginx:alpine
        container_name: dinheiro-api-nginx
        ports:
            - "${APP_PORT:-8000}:80"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./docker/nginx/logs:/var/log/nginx
        depends_on:
            - app
        networks:
            - dinheiro-net
networks:
    dinheiro-net:
        driver: bridge

version: "3.8"
services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        container_name: dinheiro-api-app
        working_dir: /var/www/html
        environment:
            - HOST_UID=${HOST_UID:-1000}
            - HOST_GID=${HOST_GID:-1000}
        volumes:
            - ./:/var/www/html
        networks:
            - dinheiro-net

networks:
    dinheiro-net:
        driver: bridge

volumes:
    dinheiro-mariadb:

services:
    app:
        container_name: dinheiro-api-app
        restart: unless-stopped
        build:
            context: .
            dockerfile: Dockerfile
            args:
                HOST_UID: ${HOST_UID:-1000}
                HOST_GID: ${HOST_GID:-1000}
        ports:
            - "${PHP_FPM_PORT:-9000}:9000"
        working_dir: /var/www/html
        environment:
            - HOST_UID=${HOST_UID:-1000}
            - HOST_GID=${HOST_GID:-1000}
        volumes:
            - ./:/var/www/html
        networks:
            - dinheiro-net
    nginx:
        image: nginx:alpine
        container_name: dinheiro-api-nginx
        restart: unless-stopped
        ports:
            - "${APP_PORT:-8000}:${EXPOSED_APP_PORT:-80}"
        volumes:
            - ./:/var/www/html
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf.template
            - ./docker/nginx/logs:/var/log/nginx
            - ./docker/nginx/entrypoint.sh:/entrypoint.sh
        entrypoint: /entrypoint.sh
        environment:
            - NGINX_PORT=${EXPOSED_APP_PORT:-80}
        depends_on:
            - app
        networks:
            - dinheiro-net
networks:
    dinheiro-net:
        driver: bridge
